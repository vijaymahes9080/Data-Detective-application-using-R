name: Deploy Shinylive Application to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R Dependencies & Shinylive
        run: |
          # Set up repositories: Posit dev universe (for shinylive) + RSPM/CRAN
          options(repos = c(
            posit = "https://posit-dev.r-universe.dev",
            getOption("repos"),
            cran = "https://cloud.r-project.org"
          ))

          # Install pak for fast, robust dependency resolution
          if (!requireNamespace("pak", quietly = TRUE)) {
            install.packages("pak", repos = "https://cloud.r-project.org")
          }

          # Install shinylive and core application packages
          pak::pak(c(
            "posit-dev/r-shinylive",
            "shiny",
            "bslib",
            "DT",
            "ggplot2",
            "readr"
          ))

          # Verify shinylive package installation
          if (!requireNamespace("shinylive", quietly = TRUE)) {
            stop("FATAL: shinylive package failed to install!")
          }
          cat("SUCCESS: Shinylive package version", as.character(packageVersion("shinylive")), "verified!\n")
        shell: Rscript {0}

      - name: Export Shiny App to Static Shinylive Site
        run: |
          # Export to static Shinylive site
          shinylive::export(".", "site", quiet = FALSE)

          # Disable Jekyll on GitHub Pages to serve all WebAssembly and underscore assets
          file.create(file.path("site", ".nojekyll"))

          # Verify that index.html and app assets exist
          if (!file.exists(file.path("site", "index.html"))) {
            stop("FATAL: Export failed - site/index.html was not generated!")
          }
          cat("SUCCESS: Static site export verified. Ready for GitHub Pages deployment.\n")
        shell: Rscript {0}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

